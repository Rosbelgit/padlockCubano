name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev

      - name: Compilar (Linux)
        run: make

      - name: Compilar y ejecutar pruebas del cifrador
        run: |
          gcc -O2 -Wall -Wextra -std=c11 -I src src/cipher.c tests/test_cipher.c -o tests/test_cipher
          ./tests/test_cipher
