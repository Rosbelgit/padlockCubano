name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libgtk-3-dev pkg-config

      - name: Compilar (Linux)
        run: make

      - name: Ejecutar pruebas
        run: ./tests/test_cipher
